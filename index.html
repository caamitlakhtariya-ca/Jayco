<!DOCTYPE html>
<html>
<head>
  <title>Jayco Combined Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; margin:0; background:#f5f6fa; }
    header { background:#2c3e50; color:#fff; padding:15px; }
    .container { padding:20px; }
    input, button, select { padding:8px; margin:5px; }
    button { cursor:pointer; }
    .hidden { display:none; }
    .card { background:#fff; padding:15px; border-radius:8px; margin-top:15px; }
    .nav button { margin-right:10px; }
  </style>
</head>

<body>

<header>
  <h2>Jayco Combined System</h2>
</header>

<div class="container">

<!-- 🔐 LOGIN -->
<div id="loginDiv" class="card">
  <h3>Login</h3>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- ⚙ CONFIG -->
<div id="configDiv" class="card hidden">
  <h3>Settings (Admin)</h3>

  <label>Production API</label><br>
  <input id="prodApi"><br>

  <label>Vendor API</label><br>
  <input id="vendorApi"><br>

  <button onclick="saveConfig()">Save</button>
</div>

<!-- 🧭 MAIN APP -->
<div id="appDiv" class="hidden">

  <div class="nav card">
    <button onclick="showTab('productionTab')">Production</button>
    <button onclick="showTab('vendorMaster')">Vendor Master</button>
    <button onclick="showTab('vendorInvoices')">Invoices</button>
    <button onclick="showTab('vendorPayments')">Payments</button>
    <button onclick="showTab('dashboard')">Dashboard</button>
    <button onclick="showTab('configDiv')">Settings</button>
  </div>

  <!-- 🏭 PRODUCTION (SAFE PLACEHOLDER) -->
  <div id="productionTab" class="card hidden">
    <h3>Production System</h3>
    <p>⚠ This section uses Production API. Existing system remains untouched.</p>
  </div>

  <!-- 👥 VENDOR MASTER -->
  <div id="vendorMaster" class="card hidden">
    <h3>Vendor Master</h3>

    <input id="gstin" placeholder="GSTIN">
    <input id="vname" placeholder="Vendor Name">
    <input id="credit" placeholder="Credit Days (Default 45)">
    <button onclick="addVendor()">Save Vendor</button>

    <div id="vendorList"></div>
  </div>

  <!-- 🧾 INVOICES -->
  <div id="vendorInvoices" class="card hidden">
    <h3>Vendor Invoices</h3>

    <input id="inv_gstin" placeholder="GSTIN">
    <input id="inv_name" placeholder="Vendor Name">
    <input id="inv_amt" placeholder="Amount">
    <input id="inv_date" type="date">
    <button onclick="addInvoice()">Save Invoice</button>
  </div>

  <!-- 💳 PAYMENTS -->
  <div id="vendorPayments" class="card hidden">
    <h3>Payments</h3>
    <p>Phase 2 — will include allocation & outstanding</p>
  </div>

  <!-- 📊 DASHBOARD -->
  <div id="dashboard" class="card hidden">
    <h3>Dashboard</h3>
    <p>Phase 3 — outstanding, overdue, trends</p>
  </div>

</div>

</div>

<script>

// ================= CONFIG =================
const CONFIG = {
  productionAPI: localStorage.getItem("prodAPI") || "",
  vendorAPI: localStorage.getItem("vendorAPI") || ""
};

document.getElementById("prodApi").value = CONFIG.productionAPI;
document.getElementById("vendorApi").value = CONFIG.vendorAPI;

function saveConfig() {
  localStorage.setItem("prodAPI", prodApi.value);
  localStorage.setItem("vendorAPI", vendorApi.value);
  alert("Configuration Saved");
}

// ================= API =================
async function apiCall(api, action, payload = {}) {

  if (!api) {
    alert("API URL not configured!");
    return;
  }

  const res = await fetch(api, {
    method: "POST",
    body: JSON.stringify({ action, ...payload })
  });

  return await res.json();
}

// ================= LOGIN =================
async function login() {

  const res = await apiCall(CONFIG.vendorAPI, "login", {
    email: email.value,
    password: password.value
  });

  if (res.status === "success") {

    localStorage.setItem("user", JSON.stringify(res));

    loginDiv.classList.add("hidden");
    appDiv.classList.remove("hidden");

    routeUser(res.role);
    loadVendors();

  } else {
    alert("Invalid Login");
  }
}

// ================= ROLE =================
function routeUser(role) {

  if (role === "Admin") {
    configDiv.classList.remove("hidden");
  }

  if (role === "Accounts") {
    configDiv.classList.add("hidden");
  }

  if (role === "Production") {
    showTab("productionTab");
  }
}

// ================= NAVIGATION =================
function showTab(id) {
  document.querySelectorAll(".card").forEach(t => t.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

// ================= VENDOR =================
async function addVendor() {

  const res = await apiCall(CONFIG.vendorAPI, "addVendor", {
    gstin: gstin.value,
    name: vname.value,
    credit: credit.value
  });

  alert(res.status);
  loadVendors();
}

async function loadVendors() {

  const res = await apiCall(CONFIG.vendorAPI, "getVendors");

  if (!res || !res.data) return;

  let html = "<h4>Vendor List</h4>";

  res.data.forEach(v => {
    html += `<div>${v[0]} - ${v[1]} (Credit: ${v[2]} days)</div>`;
  });

  vendorList.innerHTML = html;
}

// ================= INVOICE =================
async function addInvoice() {

  await apiCall(CONFIG.vendorAPI, "addInvoice", {
    gstin: inv_gstin.value,
    name: inv_name.value,
    amount: inv_amt.value,
    date: inv_date.value
  });

  alert("Invoice Saved");
}

</script>

</body>
</html>
